name: Bug report
description: Something does not work as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include credentials, tokens or other secrets.
        Security issues go to the repository's SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit you are using.
      placeholder: v1.2.3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture; Go, Terraform/OpenTofu or MCP client version, as applicable.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code, configuration or commands that show the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Logs or error messages. Remove secrets first.
      render: shell
